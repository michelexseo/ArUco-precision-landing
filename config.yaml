SIDE_LENGTH: 0.2
EXPECTED_MARKER_ID: 0
ARUCO_DICT_TYPE: "DICT_4X4_1000"
CALIBRATION_PARAMS: "camera_calibration.npz"
CAMERA_INDEX: "udpsrc port=5600 ! application/x-rtp, payload=96 ! rtph264depay ! avdec_h264 ! videoconvert ! appsink"
CAMERA_TOPIC: "/world/aruco/model/x500_mono_cam_down_0/link/camera_link/sensor/camera/image"
CAMERA_WIDTH: 640
CAMERA_HEIGHT: 480
CAMERA_FPS: 30
MAVLINK_CONNECTION_STRING: "udpin:127.0.0.1:14540"
LOG_DIR: "logs"
LOG_SUMMARY_INTERVAL_SEC: 5
LOG_EVERY_FRAME: true          # false = only log when marker detected
LOG_SAVE_FRAMES: true           # save camera snapshots when marker is detected
LOG_FRAME_INTERVAL: 30          # save every Nth logged loop while marker is detected
LOG_MAVLINK_MESSAGES:          # optional extra FC messages
  - HEARTBEAT
  - SYS_STATUS